<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plans</title>
<style>
:root{
  --bg:#1b1f24; --bg2:#232830; --bd:#343b45; --fg:#e8ecf1; --fg2:#98a3b1;
  --acc:#4fa8ff; --acc2:#2b6fb8; --warn:#ffb454;
  --sb:300px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--fg);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

#app{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:auto 1fr;height:100%}
header{
  grid-column:1/-1;display:flex;align-items:center;gap:14px;
  padding:0 16px;height:52px;background:var(--bg2);border-bottom:1px solid var(--bd);
}
header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .meta{color:var(--fg2);font-size:12px;white-space:nowrap}
header .sp{flex:1}
#burger{display:none;font-size:20px;padding:4px 10px;border-radius:6px}
#burger:hover{background:#2f3641}

aside{background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.search{padding:10px}
.search input{
  width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--bd);
  background:#171b20;color:var(--fg);font:inherit;outline:none;
}
.search input:focus{border-color:var(--acc)}
#count{padding:0 12px 8px;color:var(--fg2);font-size:11.5px}
#list{flex:1;overflow-y:auto;padding:0 8px 12px}
#list::-webkit-scrollbar{width:10px}
#list::-webkit-scrollbar-thumb{background:#3c444f;border-radius:5px;border:3px solid var(--bg2)}
.item{
  display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;
  border-left:3px solid transparent;margin-bottom:2px;
}
.item:hover{background:#2b323b}
.item.on{background:#26364a;border-left-color:var(--acc)}
.item .n{font-weight:600;font-size:13px}
.item .t{color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on .t{color:#c4d3e4}
.item .d{color:#79838f;font-size:11px;font-variant-numeric:tabular-nums}
.item .b3d{
  display:inline-block;margin-right:5px;padding:0 5px;border-radius:8px;
  background:#3b2f52;color:#c9b6ee;font-size:10px;font-weight:600;
  vertical-align:1px;
}
.item.on .d{color:#9fb3c8}
.empty{padding:20px 12px;color:var(--fg2);font-size:12.5px;text-align:center}

main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#14171b}
.tools{
  display:flex;align-items:center;gap:6px;padding:0 12px;
  background:var(--bg2);border-bottom:1px solid var(--bd);
  height:41px;flex:0 0 41px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
}
.tools button{padding:6px 11px;border-radius:6px;border:1px solid var(--bd);background:#272d36;font-size:13px;flex:0 0 auto;white-space:nowrap}
.tools button:hover{background:#333b46;border-color:#4a5462}
.tools button.on{background:var(--acc2);border-color:var(--acc);color:#fff;font-weight:600}
.tools .sep{width:1px;height:22px;background:var(--bd);margin:0 5px}
.tools .sp{flex:1}
#zoomval{min-width:56px;text-align:center;color:var(--fg2);font-variant-numeric:tabular-nums;font-size:12.5px}
select{
  padding:6px 8px;border-radius:6px;border:1px solid var(--bd);background:#272d36;
  color:var(--fg);font:inherit;font-size:12.5px;outline:none;cursor:pointer;
}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv.grab{cursor:grab} #cv.grabbing{cursor:grabbing} #cv.cross{cursor:crosshair}
#hint{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  background:rgba(20,23,27,.94);border:1px solid var(--bd);border-radius:8px;
  padding:7px 14px;font-size:12.5px;color:#cfd8e3;pointer-events:none;
  opacity:0;transition:opacity .18s;max-width:82%;text-align:center;
}
#hint.show{opacity:1}
#coffre{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;
  justify-content:center;background:#14171b;padding:24px;
}
#coffre.on{display:flex}
#coffre .bloc{
  width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--bd);
  border-radius:12px;padding:26px 24px;text-align:center;
}
#coffre h2{font-size:16px;margin:0 0 6px}
#coffre p{color:var(--fg2);font-size:12.5px;margin:0 0 18px;line-height:1.5}
#coffre input[type=password]{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);
  background:#272d36;color:var(--fg);font:inherit;font-size:14px;outline:none;
  text-align:center;letter-spacing:2px;
}
#coffre input[type=password]:focus{border-color:var(--acc)}
#coffre button{
  width:100%;margin-top:12px;padding:10px;border-radius:8px;border:0;
  background:var(--acc);color:#fff;font:inherit;font-size:14px;font-weight:600;
}
#coffre button:disabled{opacity:.55}
#coffre .memo{
  display:flex;align-items:center;gap:7px;justify-content:center;
  margin-top:14px;color:var(--fg2);font-size:12px;
}
#coffre .err{color:#ff8b8b;font-size:12.5px;margin-top:12px;min-height:16px}
#splash{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;color:var(--fg2);text-align:center;padding:24px;
}
#splash b{color:var(--fg);font-size:15px;font-weight:600}
.bar{
  display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--bg2);
  border-top:1px solid var(--bd);font-size:12px;color:var(--fg2);
  font-variant-numeric:tabular-nums;
  /* hauteur FIXE et pas de retour a la ligne : une barre qui grandit
     retrecirait la zone du plan, et le dessin sauterait pendant la mesure */
  height:32px;flex:0 0 32px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;
}
.bar > span{overflow:hidden;text-overflow:ellipsis}
#infoPlan{flex:0 1 auto;min-width:0}
#infoMes{flex:0 1 auto;min-width:0;text-align:right}
#infoEch{flex:0 0 auto}
.bar b{color:var(--fg);font-weight:600}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:11px;
  background:#2a3441;color:#a9c6e8;font-size:11.5px;
}
.tag.w{background:#3a2f1c;color:var(--warn)}

#modal{position:absolute;inset:0;background:rgba(10,12,15,.72);display:none;align-items:center;justify-content:center;z-index:20}
#modal.show{display:flex}
.box{background:var(--bg2);border:1px solid var(--bd);border-radius:11px;padding:20px;width:min(410px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.box h3{margin:0 0 6px;font-size:15px}
.box p{margin:0 0 14px;color:var(--fg2);font-size:12.5px;line-height:1.5}
.box input{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--bd);background:#171b20;color:var(--fg);font:inherit;outline:none}
.box input:focus{border-color:var(--acc)}
.box .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.box .row button{padding:8px 15px;border-radius:7px;border:1px solid var(--bd);background:#272d36}
.box .row button.p{background:var(--acc2);border-color:var(--acc);color:#fff;font-weight:600}

@media(max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:absolute;top:52px;bottom:0;left:0;width:var(--sb);max-width:86vw;z-index:15;transform:translateX(-102%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #burger{display:block}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="burger" title="Liste des plans">&#9776;</button>
    <h1 id="titre">Plans</h1>
    <span class="sp"></span>
    <span class="meta" id="sousTitre"></span>
  </header>

  <aside id="aside">
    <div class="search"><input id="q" type="search" placeholder="Rechercher un plan…" autocomplete="off"></div>
    <div id="count"></div>
    <div id="list"></div>
  </aside>

  <main>
    <div class="tools">
      <button id="bPrev" title="Plan précédent">&#8249;</button>
      <button id="bNext" title="Plan suivant">&#8250;</button>
      <span class="sep"></span>
      <button id="bOut" title="Zoom arrière">&minus;</button>
      <span id="zoomval">—</span>
      <button id="bIn" title="Zoom avant">+</button>
      <button id="bFit" title="Ajuster à l'écran (F)">Ajuster</button>
      <span class="sep"></span>
      <button id="bMes" title="Mesurer : cliquez 2 points (M)">Mesurer</button>
      <button id="bSnap" class="on" title="Accrochage : extrémité, milieu, intersection, sur le trait, parallèle (A)">Accrochage</button>
      <button id="bClr" title="Effacer les mesures de ce plan">Effacer</button>
      <span class="sp"></span>
      <select id="selEch" title="Échelle utilisée pour convertir les mesures"></select>
      <select id="selUnit" title="Unité d'affichage">
        <option value="m">m</option><option value="cm">cm</option><option value="mm">mm</option>
      </select>
    </div>

    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="splash"><b>Choisissez un plan dans la liste</b><span>Molette = zoom · glisser = déplacer · M = mesurer</span></div>
    </div>

    <div class="bar">
      <span id="infoPlan">—</span>
      <span id="infoDate" class="tag" hidden></span>
      <span id="infoEch" class="tag" hidden></span>
      <span class="sp" style="flex:1"></span>
      <span id="infoMes">—</span>
    </div>
  </main>
</div>

<div id="modal"><div class="box">
  <h3 id="mTitre">Calibrer l'échelle</h3>
  <p id="mTexte"></p>
  <input id="mInput" type="text" inputmode="decimal" autocomplete="off">
  <div class="row"><button id="mNon">Annuler</button><button id="mOui" class="p">Valider</button></div>
</div></div>

<div id="coffre"><div class="bloc">
  <h2>Plans protégés</h2>
  <p>Ces plans sont chiffrés. Saisissez le mot de passe que vous a communiqué
     François pour les consulter.</p>
  <input id="cofMdp" type="password" autocomplete="current-password"
         placeholder="Mot de passe">
  <button id="cofOk">Déverrouiller</button>
  <label class="memo"><input id="cofMemo" type="checkbox" checked>
     Rester déverrouillé sur cet ordinateur</label>
  <div class="err" id="cofErr"></div>
</div></div>

<script src="pdfjs/pdf.min.js"></script>
<script src="garde.js"></script>
<script src="donnees.js"></script>
<script>
"use strict";
(function(){

// Les donnees peuvent arriver chiffrees : on part vide et on les pose une
// fois le coffre ouvert (voir poserDonnees).
var D = {projet:"",genere:"",plans:[]};
var PLANS = [];
var MM_PAR_PT = 25.4/72;          // definition du point PDF : exacte

try{ pdfjsLib.GlobalWorkerOptions.workerSrc = "pdfjs/pdf.worker.min.js"; }catch(e){}

// ---------------------------------------------------------------- etat
var plan=null, page=null, cache={}, ordre=[], filtre=[];
var MAX_EN_MEMOIRE = 3;      // documents gardes ouverts (les autres liberes)
var travailleur = null;      // UN seul worker pdf.js pour tout le site
// PDF[id] = contenu du plan en base64, depose par plans/<id>.js.
// DOIT etre global : le fichier du plan est charge par une balise <script>
// et ne voit pas les variables de cette fonction.
window.PDF = window.PDF || {};
var PDF = window.PDF;
var zoom=1, panX=0, panY=0, besoinFit=true, autoCadre=true;
var tuile=null, tache=null, minuteur=null, jeton=0;
var mesurer=false, pts=[], survol=null;
var mesures={}, calib={}, forceEch=0, unite="m";

var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var stage=document.getElementById("stage");
var $=function(id){return document.getElementById(id)};

try{
  mesures=JSON.parse(localStorage.getItem("fa_mesures")||"{}");
  calib =JSON.parse(localStorage.getItem("fa_calib")||"{}");
  unite =localStorage.getItem("fa_unite")||"m";
}catch(e){}
$("selUnit").value=unite;

function sauver(){
  try{
    localStorage.setItem("fa_mesures",JSON.stringify(mesures));
    localStorage.setItem("fa_calib",JSON.stringify(calib));
    localStorage.setItem("fa_unite",unite);
  }catch(e){}
}

function poserDonnees(obj){
  D = obj || {projet:"",genere:"",plans:[]};
  PLANS = D.plans || [];
  document.title = D.projet ? (D.projet+" — Plans") : "Plans";
  $("titre").textContent = D.projet || "Plans";
  $("sousTitre").textContent = PLANS.length + " plan" + (PLANS.length>1?"s":"") +
    (D.genere ? " · publié le "+D.genere : "");
}

// ---------------------------------------------------------------- coffre
// Les plans voyagent chiffres (AES-256-GCM). La cle est derivee du mot de
// passe ICI, dans le navigateur : elle n'est jamais envoyee a l'hebergeur, qui
// ne detient que des blocs illisibles.
var CLE = null;                       // cle AES en memoire, jamais stockee
var JETON = "FrancoisAPP-visionneuse";

function b64oct(b){
  var s=atob(b), n=s.length, u=new Uint8Array(n);
  for(var i=0;i<n;i++) u[i]=s.charCodeAt(i);
  return u;
}

function deriverCle(mdp){
  var e=new TextEncoder();
  return crypto.subtle.importKey("raw", e.encode(mdp), "PBKDF2", false, ["deriveBits"])
    .then(function(base){
      return crypto.subtle.deriveBits(
        {name:"PBKDF2", salt:b64oct(GARDE.sel), iterations:GARDE.it, hash:"SHA-256"},
        base, 256);
    })
    .then(function(brut){
      return crypto.subtle.importKey("raw", brut, "AES-GCM", false, ["decrypt"]);
    });
}

// format : iv (12 octets) + chiffre + marque d'authenticite (16 octets)
function dechiffrer(b64, cle){
  var t=b64oct(b64);
  return crypto.subtle.decrypt({name:"AES-GCM", iv:t.slice(0,12)},
                               cle || CLE, t.slice(12))
    .then(function(buf){ return new Uint8Array(buf); });
}

function ouvrirCoffre(mdp){
  return deriverCle(mdp).then(function(cle){
    return dechiffrer(GARDE.essai, cle).then(function(u){
      if(new TextDecoder().decode(u) !== JETON) throw new Error("mdp");
      CLE = cle;
      return dechiffrer(DONNEES_CHIFFRE, cle);
    });
  }).then(function(u){
    return JSON.parse(new TextDecoder().decode(u));
  });
}

function demanderMotDePasse(){
  var boite=$("coffre"), champ=$("cofMdp"), bouton=$("cofOk"), err=$("cofErr");
  boite.classList.add("on");
  setTimeout(function(){ champ.focus(); }, 50);

  function tenter(){
    var mdp=champ.value;
    if(!mdp) return;
    bouton.disabled=true; err.textContent="Vérification…";
    ouvrirCoffre(mdp).then(function(obj){
      try{
        if($("cofMemo").checked) localStorage.setItem("fa_mdp", mdp);
        else localStorage.removeItem("fa_mdp");
      }catch(e){}
      boite.classList.remove("on");
      champ.value="";
      poserDonnees(obj);
      lancer();
    })["catch"](function(){
      bouton.disabled=false;
      err.textContent="Mot de passe incorrect.";
      champ.select();
      try{ localStorage.removeItem("fa_mdp"); }catch(e){}
    });
  }
  bouton.onclick=tenter;
  champ.onkeydown=function(e){ if(e.key==="Enter") tenter(); };

  // deja deverrouille sur cet ordinateur : on rouvre sans rien demander
  var garde=null;
  try{ garde=localStorage.getItem("fa_mdp"); }catch(e){}
  if(garde){ champ.value=garde; tenter(); }
}

// ---------------------------------------------------------------- liste
function listerPlans(){
  var q=$("q").value.trim().toLowerCase();
  filtre = q ? PLANS.filter(function(p){
    return (p.num+" "+p.nom).toLowerCase().indexOf(q)>=0;
  }) : PLANS.slice();

  var l=$("list"); l.innerHTML="";
  $("count").textContent = filtre.length===PLANS.length
    ? PLANS.length+" plan"+(PLANS.length>1?"s":"")
    : filtre.length+" / "+PLANS.length+" plan"+(PLANS.length>1?"s":"");
  if(!filtre.length){ l.innerHTML='<div class="empty">Aucun plan ne correspond.</div>'; return; }

  filtre.forEach(function(p){
    var b=document.createElement("button");
    b.className="item"+(plan&&p.id===plan.id?" on":"");
    b.innerHTML='<div class="n"></div><div class="t"></div><div class="d"></div>';
    b.children[0].textContent=p.num;
    b.children[1].textContent=p.nom;
    b.children[2].innerHTML = (p.type==="3d" ? '<span class="b3d">3D</span>' : "")
      + (p.date ? "PDF du "+p.date : "");
    b.title=p.num+" — "+p.nom+(p.date?"\nPDF exporté le "+p.date:"");
    b.onclick=function(){ ouvrir(p); if(innerWidth<=820) $("aside").classList.remove("open"); };
    l.appendChild(b);
  });
}
$("q").oninput=listerPlans;

// ---------------------------------------------------------------- papier
// Le PDF fait foi sur la taille de page. Parmi les emprises candidates
// exportees par Revit, on retient celle dont le rapport largeur/hauteur colle
// a la page : elle donne l'origine et l'echelle papier des fenetres.
function calerPapier(p, ptL, ptH){
  var cible=ptL/ptH, best=null, ecart=1e9;
  (p.papiers||[]).forEach(function(c){
    var m=c.mm, w=m[2]-m[0], h=m[3]-m[1];
    if(w<=0||h<=0) return;
    var e=Math.abs((w/h)-cible)/cible;
    if(e<ecart){ ecart=e; best=c; }
  });
  if(!best){
    p._pap={mm:[0,0,ptL*MM_PAR_PT,ptH*MM_PAR_PT],origine:"page PDF"};
    p._ecart=0;
  }else{
    p._pap=best; p._ecart=ecart;
  }
  p._mmParPt=(p._pap.mm[2]-p._pap.mm[0])/ptL;
  p._pt=[ptL,ptH];
}
// monde (points PDF, Y vers le bas) -> mm feuille Revit (Y vers le haut)
function versMm(q){
  return {x: plan._pap.mm[0] + q.x*plan._mmParPt,
          y: plan._pap.mm[3] - q.y*plan._mmParPt};
}

// ---------------------------------------------------------------- ouverture
function ouvrir(p){
  if(plan && p && p.id===plan.id) return;
  var mien = ++jeton;
  plan=p; page=null; tuile=null; pts=[]; survol=null; forceEch=0;
  curseur=null; accroche=null; refsPara=[];
  besoinFit=true; autoCadre=true;
  if(tache){ try{tache.cancel()}catch(e){} tache=null; }
  $("splash").style.display="none";
  $("infoPlan").textContent=p.num+" — "+p.nom;
  var jd=$("infoDate");
  jd.hidden=!p.date; jd.className="tag";
  jd.textContent=p.date ? "PDF du "+p.date : "";
  listerPlans(); majSelectEchelle(); dessiner();

  if(cache[p.id]){ page=cache[p.id].page; apresChargement(); return; }
  indice("Chargement de "+p.num+"…",0);
  chargerOctets(p, function(octets){
    if(mien!==jeton) return;
    var doc;
    pdfjsLib.getDocument({data:octets, worker:worker()}).promise.then(function(pdf){
    doc=pdf; return pdf.getPage(1);
  }).then(function(pg){
    if(mien!==jeton){ try{doc.destroy()}catch(e){} return; }
    ranger(p.id, doc, pg); page=pg;
    var v=pg.getViewport({scale:1});
    calerPapier(p, v.width, v.height);
    indice("",0); apresChargement();
  })["catch"](function(err){
      if(mien!==jeton) return;
      page=null; dessiner();
      indice("PDF illisible ("+p.num+") : "+((err&&err.message)||err),9000);
    });
  }, function(err){
    if(mien!==jeton) return;
    page=null; dessiner();
    indice(err,9000);
  });
}

// Un seul worker pour tout le site : en creer un par feuille les accumulait
// jusqu'a ce que pdf.js n'arrive plus a en demarrer.
function worker(){
  if(!travailleur){
    try{ travailleur = new pdfjsLib.PDFWorker({name:"francoisapp"}); }
    catch(e){ travailleur = null; }
  }
  return travailleur || undefined;
}

// Garde les derniers documents ouverts et libere les plus anciens : un PDF
// de carnet pese plusieurs Mo, on n'en empile pas cinquante.
function ranger(id, doc, pg){
  cache[id]={doc:doc, page:pg};
  ordre.push(id);
  while(ordre.length > MAX_EN_MEMOIRE){
    var vieux=ordre.shift();
    if(vieux===id || !cache[vieux]) continue;
    try{ cache[vieux].doc.destroy(); }catch(e){}
    delete cache[vieux];
  }
}

// Charge plans/<id>.js par une balise <script> : contrairement a fetch/XHR,
// c'est autorise quand la page est ouverte en file:// (double-clic).
function chargerOctets(p, ok, ko){
  // Dossier produit par une version anterieure de l'outil : les plans y sont
  // des .pdf bruts, que file:// interdit de lire. On le dit franchement.
  if(!/\.js$/i.test(p.fichier||"")){
    return ko("Ces plans ont été générés par une version précédente de "+
              "l'outil. Relancez « Visionneuse web » dans Revit sur ce dossier.");
  }
  function livrer(){
    var b64=PDF[p.id];
    delete PDF[p.id];               // libere la copie base64 (+33 % de memoire)
    if(CLE){
      return dechiffrer(b64).then(ok, function(){
        ko("Plan illisible ("+p.num+") : le déchiffrement a échoué");
      });
    }
    try{ ok(b64oct(b64)); }
    catch(e){ ko("Plan illisible ("+p.num+") : fichier abime"); }
  }
  if(PDF[p.id]) return livrer();
  var sc=document.createElement("script");
  sc.src=p.fichier;
  sc.onload=function(){
    sc.parentNode.removeChild(sc);
    PDF[p.id] ? livrer() : ko("Plan vide : "+p.fichier);
  };
  sc.onerror=function(){
    sc.parentNode.removeChild(sc);
    ko("Fichier introuvable : "+p.fichier);
  };
  document.head.appendChild(sc);
}
function apresChargement(){
  majSelectEchelle();
  ajuster();
  // le plan vient d'arriver : si la mesure est deja active, c'est ICI que
  // l'index d'accrochage doit se construire (le bouton a pu etre clique
  // pendant le chargement, quand il n'y avait pas encore de page)
  if(mesurer && accrochage) preparerAccrochage(plan, page);
  if(plan.type==="3d"){
    // pas d'echelle possible sur une 3D : le dire tout de suite plutot que de
    // laisser croire a une cote juste
    indice("Vue 3D : aucune échelle connue. Pour mesurer, tracez une cote "+
           "connue puis choisissez « Calibrer… » à droite.",8000);
  }else if(plan._ecart>0.02){
    indice("Emprise de feuille incertaine sur ce plan : vérifiez une cote connue, "+
           "sinon utilisez « Calibrer… »",7000);
  }
}

// ---------------------------------------------------------------- vue
function ajuster(){
  var r=stage.getBoundingClientRect();
  if(!page||r.width<2||r.height<2){ besoinFit=true; dessiner(); return; }
  zoom=Math.min(r.width/plan._pt[0], r.height/plan._pt[1])*0.97;
  panX=(r.width-plan._pt[0]*zoom)/2;
  panY=(r.height-plan._pt[1]*zoom)/2;
  besoinFit=false;
  planifier();
}
function cadrer(){ autoCadre=true; ajuster(); }
function versEcran(q){ return {x:q.x*zoom+panX, y:q.y*zoom+panY}; }
function versMonde(x,y){ return {x:(x-panX)/zoom, y:(y-panY)/zoom}; }

function zoomer(f,cx,cy){
  var r=stage.getBoundingClientRect();
  if(cx===undefined){ cx=r.width/2; cy=r.height/2; }
  var av=versMonde(cx,cy);
  besoinFit=false; autoCadre=false;
  zoom=Math.max(0.002,Math.min(400,zoom*f));
  panX=cx-av.x*zoom; panY=cy-av.y*zoom;
  planifier();
}

// ---------------------------------------------------------------- rendu PDF
// On ne rasterise QUE la region visible : une feuille de 33 m coute le meme
// prix qu'un A3. Pendant les manipulations on etire la derniere tuile (fluide),
// puis on refait un rendu net des que la main s'arrete.
function planifier(){
  dessiner();
  clearTimeout(minuteur);
  minuteur=setTimeout(rendu,110);
}

function rendu(){
  if(!page) return;
  var r=stage.getBoundingClientRect();
  if(r.width<2||r.height<2) return;
  if(tache){ try{tache.cancel()}catch(e){} tache=null; }

  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
  var zi=zoom, pxi=panX, pyi=panY, mien=jeton;

  var off=document.createElement("canvas");
  off.width=w; off.height=h;
  tache=page.render({
    canvasContext: off.getContext("2d"),
    viewport: page.getViewport({scale:zi*dpr}),
    transform: [1,0,0,1, pxi*dpr, pyi*dpr],
    background: "rgba(0,0,0,0)"
  });
  tache.promise.then(function(){
    if(mien!==jeton) return;
    tuile={cv:off, zoom:zi, panX:pxi, panY:pyi, dpr:dpr};
    dessiner();
  })["catch"](function(){ /* rendu annule pendant une manipulation : normal */ });
}

function tailleCanvas(){
  var r=stage.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*d));
  cv.height=Math.max(1,Math.round(r.height*d));
  ctx.setTransform(d,0,0,d,0,0);
  return r;
}

function dessiner(){
  var r=tailleCanvas();
  ctx.clearRect(0,0,r.width,r.height);

  if(!page){
    if(plan){
      ctx.fillStyle="#98a3b1"; ctx.font="13px 'Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText("Chargement…",r.width/2,r.height/2);
    }
    majBarre(); return;
  }

  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.45)"; ctx.shadowBlur=16; ctx.shadowOffsetY=3;
  ctx.fillStyle="#fff";
  ctx.fillRect(panX,panY,plan._pt[0]*zoom,plan._pt[1]*zoom);
  ctx.restore();

  if(tuile){
    var k=zoom/tuile.zoom;
    var s=versEcran({x:(0-tuile.panX)/tuile.zoom, y:(0-tuile.panY)/tuile.zoom});
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
    ctx.drawImage(tuile.cv, s.x, s.y,
                  tuile.cv.width/tuile.dpr*k, tuile.cv.height/tuile.dpr*k);
  }

  var liste=(mesures[plan.id]||[]).slice();
  if(pts.length===1 && survol) liste.push({a:pts[0],b:survol,live:true});
  liste.forEach(traceMesure);
  if(pts.length===1){
    var q=versEcran(pts[0]);
    ctx.fillStyle="#4fa8ff"; ctx.beginPath(); ctx.arc(q.x,q.y,4,0,6.284); ctx.fill();
  }
  if(mesurer && accroche) marqueAccroche(ctx, accroche);
  majBarre();
}

// ---------------------------------------------------------------- echelles
function vuesDuPlan(){ return (plan&&plan.vues)||[]; }

function echelleEn(mm){
  var best=null,aire=Infinity;
  vuesDuPlan().forEach(function(v){
    var r=v.rect_mm;
    if(mm.x>=r[0]&&mm.x<=r[2]&&mm.y>=r[1]&&mm.y<=r[3]){
      var a=(r[2]-r[0])*(r[3]-r[1]);
      if(a<aire){aire=a;best=v;}
    }
  });
  return best;
}
function echellePour(a,b){
  if(forceEch) return {nom:"choix manuel",echelle:forceEch,manuel:true};
  if(calib[plan.id]) return {nom:"calibrée",echelle:calib[plan.id],calib:true};
  var ma=versMm(a), mb=versMm(b);
  var v=echelleEn({x:(ma.x+mb.x)/2,y:(ma.y+mb.y)/2})||echelleEn(ma)||echelleEn(mb);
  if(v) return {nom:v.nom,echelle:v.echelle};
  var vs=vuesDuPlan();
  if(vs.length===1) return {nom:vs[0].nom,echelle:vs[0].echelle};
  return null;
}
function majSelectEchelle(){
  var s=$("selEch"); s.innerHTML="";
  var o=document.createElement("option");
  o.value="0"; o.textContent="Échelle : auto"; s.appendChild(o);
  var vus={};
  vuesDuPlan().forEach(function(v){ vus[v.echelle]=1; });
  Object.keys(vus).map(Number).sort(function(a,b){return a-b}).forEach(function(e){
    var x=document.createElement("option");
    x.value=String(e); x.textContent="Forcer 1:"+e; s.appendChild(x);
  });
  [20,25,50,100,200].forEach(function(e){
    if(vus[e]) return;
    var x=document.createElement("option");
    x.value=String(e); x.textContent="Forcer 1:"+e; s.appendChild(x);
  });
  var c=document.createElement("option");
  c.value="cal"; c.textContent=(plan&&calib[plan.id])?"Recalibrer…":"Calibrer…";
  s.appendChild(c);
  s.value="0";
}
$("selEch").onchange=function(){
  if(this.value==="cal"){ this.value=String(forceEch||0); lancerCalibration(); return; }
  forceEch=Number(this.value)||0;
  if(forceEch && plan) delete calib[plan.id];
  sauver(); dessiner();
};

// ---------------------------------------------------------------- distances
function mmReels(a,b){
  if(!plan||!plan._mmParPt) return null;
  var mmFeuille=Math.hypot(b.x-a.x,b.y-a.y)*plan._mmParPt;
  var e=echellePour(a,b);
  if(!e) return {mmFeuille:mmFeuille,mm:null,src:null};
  return {mmFeuille:mmFeuille, mm:mmFeuille*e.echelle, src:e};
}
function fmt(mm){
  if(mm===null||mm===undefined) return "—";
  if(unite==="mm") return Math.round(mm).toLocaleString("fr-FR")+" mm";
  if(unite==="cm") return (mm/10).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1})+" cm";
  return (mm/1000).toLocaleString("fr-FR",{minimumFractionDigits:3,maximumFractionDigits:3})+" m";
}
$("selUnit").onchange=function(){ unite=this.value; sauver(); dessiner(); };

function traceMesure(m){
  var a=versEcran(m.a), b=versEcran(m.b);
  var d=mmReels(m.a,m.b), coul=m.live?"#4fa8ff":"#ff5c5c";
  ctx.save();
  ctx.lineWidth=2; ctx.strokeStyle=coul; ctx.setLineDash(m.live?[6,4]:[]);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.setLineDash([]);
  var ang=Math.atan2(b.y-a.y,b.x-a.x), L=7;
  [a,b].forEach(function(q){
    ctx.beginPath();
    ctx.moveTo(q.x-Math.sin(ang)*L,q.y+Math.cos(ang)*L);
    ctx.lineTo(q.x+Math.sin(ang)*L,q.y-Math.cos(ang)*L);
    ctx.stroke();
  });
  var txt=d?fmt(d.mm!==null?d.mm:d.mmFeuille):"—";
  if(d && d.mm===null) txt+=" (feuille)";
  ctx.font="600 13px 'Segoe UI',sans-serif";
  var w=ctx.measureText(txt).width, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  ctx.fillStyle="rgba(255,255,255,.94)"; ctx.strokeStyle=coul; ctx.lineWidth=1.5;
  var rx=mx-w/2-7, ry=my-21;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(rx,ry,w+14,22,5); else ctx.rect(rx,ry,w+14,22);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle="#16202b"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(txt,mx,ry+11);
  ctx.restore();
}

function majBarre(){
  $("zoomval").textContent = page ? Math.round(zoom*100)+" %" : "—";
  var t=$("infoEch");
  if(!plan){ t.hidden=true; $("infoMes").textContent="—"; return; }
  var last=(mesures[plan.id]||[]).slice(-1)[0];
  var ref=last || (pts.length===1&&survol?{a:pts[0],b:survol}:null);
  if(ref){
    var d=mmReels(ref.a,ref.b);
    if(d && d.mm!==null){
      $("infoMes").innerHTML="Dernière mesure : <b>"+fmt(d.mm)+"</b>"+
        "  <span style='color:#98a3b1'>(sur feuille "+d.mmFeuille.toFixed(1)+" mm)</span>";
    }else{
      $("infoMes").innerHTML="Dernière mesure : <b>"+(d?d.mmFeuille.toFixed(1)+" mm sur feuille":"—")+"</b>";
    }
    if(d && d.src){
      t.hidden=false; t.className="tag"+(d.src.manuel||d.src.calib?" w":"");
      t.textContent="1:"+Math.round(d.src.echelle)+" · "+d.src.nom;
    }else{
      t.hidden=false; t.className="tag w";
      t.textContent="échelle inconnue ici — choisissez-la à droite";
    }
  }else{
    $("infoMes").textContent=(mesures[plan.id]||[]).length?"":"Cliquez « Mesurer » puis 2 points";
    var vs=vuesDuPlan();
    if(vs.length){ t.hidden=false; t.className="tag";
      t.textContent=vs.length+" vue"+(vs.length>1?"s":"")+" · échelle auto"; }
    else{ t.hidden=false; t.className="tag w"; t.textContent="aucune échelle connue — calibrez"; }
  }
}

function indice(txt,ms){
  var h=$("hint");
  if(!txt){ h.classList.remove("show"); return; }
  h.textContent=txt; h.classList.add("show");
  clearTimeout(h._t);
  if(ms) h._t=setTimeout(function(){h.classList.remove("show")},ms);
}

// ---------------------------------------------------------------- accrochages
// On relit la GEOMETRIE du PDF (pas les pixels) : pdf.js expose la liste des
// operateurs de dessin. On en tire les segments, dans le meme repere que la
// mesure, puis on accroche le curseur aux extremites, aux intersections et
// aux traits. C'est ce qui permet de mesurer une cote exacte au lieu d'un
// « a peu pres la ».
var accrochage = true;
var curseur = null;          // position brute du curseur (monde)
var accroche = null;         // point accroche retenu {x,y,type}
var RAYON = 14;              // rayon d'accrochage, en pixels ecran
var CASES_MAX = 60;          // au-dela, un segment va dans la liste "longs"
var SEGMENTS_MAX = 600000;   // garde-fou memoire

function ptsChemin(segs, ops, co, m, U, O){
  var k = 0, cur = null, debut = null;
  function pt(x, y){ return U.applyTransform([x, y], m); }
  for(var j=0;j<ops.length;j++){
    var q;
    switch(ops[j]){
      case O.moveTo:
        cur = pt(co[k], co[k+1]); debut = cur; k += 2; break;
      case O.lineTo:
        q = pt(co[k], co[k+1]); k += 2;
        if(cur) segs.push(cur[0],cur[1],q[0],q[1]);
        cur = q; break;
      case O.curveTo:            // corde : suffisant pour accrocher
        q = pt(co[k+4], co[k+5]); k += 6;
        if(cur) segs.push(cur[0],cur[1],q[0],q[1]);
        cur = q; break;
      case O.curveTo2:
      case O.curveTo3:
        q = pt(co[k+2], co[k+3]); k += 4;
        if(cur) segs.push(cur[0],cur[1],q[0],q[1]);
        cur = q; break;
      case O.closePath:
        if(cur && debut) segs.push(cur[0],cur[1],debut[0],debut[1]);
        cur = debut; break;
      case O.rectangle: {
        var x=co[k], y=co[k+1], w=co[k+2], h=co[k+3]; k += 4;
        var a=pt(x,y), b=pt(x+w,y), c=pt(x+w,y+h), d=pt(x,y+h);
        segs.push(a[0],a[1],b[0],b[1], b[0],b[1],c[0],c[1],
                  c[0],c[1],d[0],d[1], d[0],d[1],a[0],a[1]);
        cur = a; debut = a; break; }
    }
  }
}

function segmentsDuPdf(liste, vp){
  var O = pdfjsLib.OPS, U = pdfjsLib.Util;
  var ctm = [1,0,0,1,0,0], pile = [], segs = [];
  var fn = liste.fnArray, ar = liste.argsArray;
  for(var i=0;i<fn.length && segs.length < SEGMENTS_MAX*4;i++){
    var f = fn[i];
    if(f === O.save) pile.push(ctm);
    else if(f === O.restore) ctm = pile.pop() || [1,0,0,1,0,0];
    else if(f === O.transform) ctm = U.transform(ctm, ar[i]);
    else if(f === O.constructPath)
      ptsChemin(segs, ar[i][0], ar[i][1], U.transform(vp.transform, ctm), U, O);
  }
  return segs;
}

// Index par cases : trouver les segments proches du curseur sans parcourir
// les centaines de milliers de traits d'un carnet.
function construireIndex(tab){
  var n = tab.length / 4;
  if(!n) return null;
  var segs = new Float64Array(tab);
  var x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for(var i=0;i<segs.length;i+=2){
    if(segs[i]<x0) x0=segs[i];   if(segs[i]>x1) x1=segs[i];
    if(segs[i+1]<y0) y0=segs[i+1]; if(segs[i+1]>y1) y1=segs[i+1];
  }
  var aire = Math.max(1,x1-x0) * Math.max(1,y1-y0);
  var cote = Math.max(2, Math.sqrt(aire * 4 / n));     // ~4 segments par case
  var g = new Map(), longs = [];
  for(var s=0;s<n;s++){
    var ax=segs[4*s], ay=segs[4*s+1], bx=segs[4*s+2], by=segs[4*s+3];
    var i0=Math.floor(Math.min(ax,bx)/cote), i1=Math.floor(Math.max(ax,bx)/cote);
    var j0=Math.floor(Math.min(ay,by)/cote), j1=Math.floor(Math.max(ay,by)/cote);
    if((i1-i0+1)*(j1-j0+1) > CASES_MAX){ longs.push(s); continue; }
    for(var a=i0;a<=i1;a++) for(var b=j0;b<=j1;b++){
      var c=a+","+b, t=g.get(c);
      if(!t) g.set(c, t=[]);
      t.push(s);
    }
  }
  return {segs:segs, n:n, cote:cote, g:g, longs:longs};
}

function candidats(ix, q, r){
  var out = ix.longs.slice(), vus = {};
  var i0=Math.floor((q.x-r)/ix.cote), i1=Math.floor((q.x+r)/ix.cote);
  var j0=Math.floor((q.y-r)/ix.cote), j1=Math.floor((q.y+r)/ix.cote);
  for(var a=i0;a<=i1;a++) for(var b=j0;b<=j1;b++){
    var t = ix.g.get(a+","+b);
    if(!t) continue;
    for(var k=0;k<t.length;k++){
      var s=t[k];
      if(!vus[s]){ vus[s]=1; out.push(s); }
    }
  }
  return out;
}

function surSegment(ax,ay,bx,by,qx,qy){
  var dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
  if(L < 1e-12) return {x:ax, y:ay, d:Math.hypot(qx-ax, qy-ay)};
  var t = ((qx-ax)*dx + (qy-ay)*dy) / L;
  t = t<0?0:(t>1?1:t);
  var px=ax+t*dx, py=ay+t*dy;
  return {x:px, y:py, d:Math.hypot(qx-px, qy-py)};
}

function croisement(ax,ay,bx,by,cx,cy,dx,dy){
  var r1x=bx-ax, r1y=by-ay, r2x=dx-cx, r2y=dy-cy;
  var den = r1x*r2y - r1y*r2x;
  if(Math.abs(den) < 1e-9) return null;              // paralleles
  var t = ((cx-ax)*r2y - (cy-ay)*r2x) / den;
  var u = ((cx-ax)*r1y - (cy-ay)*r1x) / den;
  if(t<-0.001||t>1.001||u<-0.001||u>1.001) return null;
  return {x:ax+t*r1x, y:ay+t*r1y};
}

// Tolerance du parallele : 2,5 degres. Assez large pour l'attraper a la
// souris, assez fin pour que la cote reste juste.
var COS_PARA = Math.cos(2.5 * Math.PI / 180);

// Directions ACQUISES : tout trait qu'on vient de survoler devient une
// reference possible pour le parallele (3 dernieres, comme AutoCAD).
var refsPara = [];
function noterRef(ix, s){
  var dx = ix.segs[4*s+2]-ix.segs[4*s], dy = ix.segs[4*s+3]-ix.segs[4*s+1];
  var l = Math.hypot(dx, dy);
  if(l < 1e-6) return;
  dx /= l; dy /= l;
  for(var i=0;i<refsPara.length;i++)                 // deja connue ?
    if(Math.abs(refsPara[i].dx*dx + refsPara[i].dy*dy) > 0.9999) return;
  refsPara.unshift({dx:dx, dy:dy});
  if(refsPara.length > 3) refsPara.pop();
}

function accrocheParallele(q, depart){
  if(!depart) return null;
  var vx = q.x - depart.x, vy = q.y - depart.y, L = Math.hypot(vx, vy);
  if(L < 1e-6) return null;
  var mieux = null;
  for(var i=0;i<refsPara.length;i++){
    var R = refsPara[i];
    var cos = Math.abs((vx*R.dx + vy*R.dy) / L);      // direction non orientee
    if(cos > COS_PARA && (!mieux || cos > mieux.cos))
      mieux = {cos:cos, dx:R.dx, dy:R.dy};
  }
  if(!mieux) return null;
  var t = vx*mieux.dx + vy*mieux.dy;                  // projection sur la droite
  return {x: depart.x + t*mieux.dx, y: depart.y + t*mieux.dy,
          d: 0, type: "parallèle"};
}

// Priorite : extremite, milieu, intersection, sur le trait, puis parallele.
function accrocherPoint(q, depart){
  var ix = plan && plan._snap;
  if(!accrochage || !ix || !q) return null;
  var r = RAYON / zoom;
  var cand = candidats(ix, q, r), S = ix.segs;
  var i, s, d, best = null;

  // 1. extremites
  for(i=0;i<cand.length;i++){
    s = cand[i];
    for(var e=0;e<2;e++){
      var ex=S[4*s+2*e], ey=S[4*s+2*e+1];
      d = Math.hypot(q.x-ex, q.y-ey);
      if(d < r && (!best || d < best.d))
        best = {x:ex, y:ey, d:d, type:"extrémité", seg:s};
    }
  }
  if(best){ noterRef(ix, best.seg); return best; }

  // 2. milieux
  for(i=0;i<cand.length;i++){
    s = cand[i];
    var mx=(S[4*s]+S[4*s+2])/2, my=(S[4*s+1]+S[4*s+3])/2;
    d = Math.hypot(q.x-mx, q.y-my);
    if(d < r && (!best || d < best.d))
      best = {x:mx, y:my, d:d, type:"milieu", seg:s};
  }
  if(best){ noterRef(ix, best.seg); return best; }

  // 3. segments sous le curseur
  var proches = [];
  for(i=0;i<cand.length;i++){
    s = cand[i];
    var pr = surSegment(S[4*s],S[4*s+1],S[4*s+2],S[4*s+3], q.x, q.y);
    if(pr.d < r) proches.push({s:s, pr:pr});
  }
  proches.sort(function(a,b){ return a.pr.d - b.pr.d; });
  // rien sous le curseur : reste le parallele, qui travaille dans le vide
  if(!proches.length) return accrocheParallele(q, depart);

  // 4. intersections
  var lot = proches.slice(0, 24);
  for(i=0;i<lot.length;i++) for(var j=i+1;j<lot.length;j++){
    var A=lot[i].s, B=lot[j].s;
    var x = croisement(S[4*A],S[4*A+1],S[4*A+2],S[4*A+3],
                       S[4*B],S[4*B+1],S[4*B+2],S[4*B+3]);
    if(!x) continue;
    d = Math.hypot(q.x-x.x, q.y-x.y);
    if(d < r && (!best || d < best.d))
      best = {x:x.x, y:x.y, d:d, type:"intersection", seg:A, seg2:B};
  }
  if(best){ noterRef(ix, best.seg); noterRef(ix, best.seg2); return best; }

  // 5. sur le trait
  var m = lot[0].pr;
  noterRef(ix, lot[0].s);
  return {x:m.x, y:m.y, d:m.d, type:"sur le trait", seg:lot[0].s};
}

// L'index n'est construit qu'a la premiere mesure : inutile de le payer sur
// une feuille qu'on ne fait que regarder.
function preparerAccrochage(p, pg){
  if(p._snap || p._snapEnCours || p._snapKo) return;
  p._snapEnCours = true;
  indice("Préparation des accrochages…", 0);
  pg.getOperatorList().then(function(liste){
    try{
      var vp = pg.getViewport({scale:1});
      p._snap = construireIndex(segmentsDuPdf(liste, vp));
      if(!p._snap) p._snapKo = true;
    }catch(e){ p._snapKo = true; }
    p._snapEnCours = false;
    indice(p._snapKo ? "Accrochages indisponibles sur ce plan" : "",
           p._snapKo ? 4000 : 0);
    dessiner();
  })["catch"](function(){
    p._snapKo = true; p._snapEnCours = false;
    indice("Accrochages indisponibles sur ce plan", 4000);
  });
}

function marqueAccroche(ctx, a){
  var s = versEcran(a), t = 6, T = a.type;
  ctx.save();
  ctx.lineWidth = 2; ctx.strokeStyle = "#12b886";
  ctx.beginPath();
  if(T === "extrémité") ctx.rect(s.x-t, s.y-t, 2*t, 2*t);
  else if(T === "milieu"){                       // triangle, comme AutoCAD
    ctx.moveTo(s.x-t, s.y+t); ctx.lineTo(s.x+t, s.y+t);
    ctx.lineTo(s.x, s.y-t); ctx.closePath();
  }else if(T === "intersection"){
    ctx.moveTo(s.x-t, s.y-t); ctx.lineTo(s.x+t, s.y+t);
    ctx.moveTo(s.x+t, s.y-t); ctx.lineTo(s.x-t, s.y+t);
  }else if(T === "parallèle"){                   // les deux barres du signe //
    ctx.moveTo(s.x-t+2, s.y+t); ctx.lineTo(s.x+2, s.y-t);
    ctx.moveTo(s.x-2, s.y+t);   ctx.lineTo(s.x+t-2, s.y-t);
  }else{                                         // sur le trait : sablier
    ctx.moveTo(s.x-t, s.y-t); ctx.lineTo(s.x+t, s.y-t);
    ctx.lineTo(s.x-t, s.y+t); ctx.lineTo(s.x+t, s.y+t); ctx.closePath();
  }
  ctx.stroke();
  // le nom du mode : sans lui, on ne sait pas a quoi on vient de s'accrocher
  ctx.font = "11px 'Segoe UI',sans-serif"; ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(20,23,27,.85)";
  ctx.strokeText(T, s.x + t + 5, s.y - t - 2);
  ctx.fillStyle = "#12b886";
  ctx.fillText(T, s.x + t + 5, s.y - t - 2);
  ctx.restore();
}

// ---------------------------------------------------------------- souris
var glisse=false, dep=null, bouge=0;
cv.addEventListener("pointerdown",function(e){
  if(!page) return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  glisse=true; bouge=0; dep={x:e.offsetX,y:e.offsetY,px:panX,py:panY};
  majCurseur();
});
cv.addEventListener("pointermove",function(e){
  if(!page) return;
  if(glisse&&dep){
    var dx=e.offsetX-dep.x, dy=e.offsetY-dep.y;
    bouge=Math.max(bouge,Math.abs(dx)+Math.abs(dy));
    if(!mesurer||bouge>4){
      besoinFit=false; autoCadre=false;
      panX=dep.px+dx; panY=dep.py+dy; planifier();
    }
  }else if(mesurer){
    curseur=versMonde(e.offsetX,e.offsetY);
    accroche=accrocherPoint(curseur, pts[0]);
    if(pts.length===1) survol=accroche||curseur;
    dessiner();
  }
});
cv.addEventListener("pointerup",function(e){
  if(!page) return;
  var clic=bouge<=4;
  glisse=false; dep=null; majCurseur();
  if(!clic||!mesurer) return;
  var q=versMonde(e.offsetX,e.offsetY);
  var a=accrocherPoint(q, pts[0]);
  if(a) q={x:a.x, y:a.y};          // la mesure part du point accroche
  if(pts.length===0){
    pts=[q]; survol=q; indice("Cliquez le 2ᵉ point (Échap pour annuler)",0);
  }else{
    if(!mesures[plan.id]) mesures[plan.id]=[];
    mesures[plan.id].push({a:pts[0],b:q});
    pts=[]; survol=null; sauver(); indice("Cliquez le 1ᵉʳ point d'une nouvelle mesure",2500);
  }
  dessiner();
});
cv.addEventListener("wheel",function(e){
  if(!page) return;
  e.preventDefault();
  zoomer(e.deltaY<0?1.16:1/1.16,e.offsetX,e.offsetY);
},{passive:false});
cv.addEventListener("dblclick",function(){ if(page&&!mesurer) cadrer(); });
function majCurseur(){ cv.className = mesurer ? "cross" : (glisse?"grabbing":"grab"); }

// ---------------------------------------------------------------- boutons
$("bIn").onclick=function(){zoomer(1.3)};
$("bOut").onclick=function(){zoomer(1/1.3)};
$("bFit").onclick=cadrer;
$("bMes").onclick=function(){
  mesurer=!mesurer; pts=[]; survol=null; accroche=null;
  this.classList.toggle("on",mesurer);
  majCurseur(); dessiner();
  // l'index d'accrochage n'est construit qu'ici : inutile de le payer sur
  // une feuille qu'on ne fait que consulter
  if(mesurer && page && accrochage) preparerAccrochage(plan, page);
  indice(mesurer?"Cliquez le 1ᵉʳ point de la mesure":"",mesurer?3000:0);
};
$("bSnap").onclick=function(){
  accrochage=!accrochage;
  this.classList.toggle("on",accrochage);
  if(!accrochage) accroche=null;
  else if(mesurer && page) preparerAccrochage(plan, page);
  dessiner();
  indice(accrochage?"Accrochage activé":"Accrochage désactivé",2000);
};
$("bClr").onclick=function(){
  if(!plan) return;
  delete mesures[plan.id]; pts=[]; survol=null; sauver(); dessiner();
};
$("bPrev").onclick=function(){decale(-1)};
$("bNext").onclick=function(){decale(1)};
function decale(d){
  if(!filtre.length) return;
  var i=plan?filtre.findIndex(function(p){return p.id===plan.id}):-1;
  ouvrir(filtre[(i+d+filtre.length)%filtre.length]||filtre[0]);
}
$("burger").onclick=function(){ $("aside").classList.toggle("open"); };

document.addEventListener("keydown",function(e){
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
    if(e.key==="Escape") e.target.blur();
    return;
  }
  if($("modal").classList.contains("show")) return;
  var k=e.key.toLowerCase();
  if(k==="m") $("bMes").click();
  else if(k==="a") $("bSnap").click();
  else if(k==="f") cadrer();
  else if(k==="escape"){ pts=[]; survol=null; indice("",0); dessiner(); }
  else if(e.key==="ArrowDown"||e.key==="ArrowRight"){ e.preventDefault(); decale(1); }
  else if(e.key==="ArrowUp"||e.key==="ArrowLeft"){ e.preventDefault(); decale(-1); }
  else if(k==="+"||k==="="){ zoomer(1.3); }
  else if(k==="-"){ zoomer(1/1.3); }
});

// ---------------------------------------------------------------- calibration
function lancerCalibration(){
  var l=(mesures[plan.id]||[]);
  if(!l.length){
    indice("Tracez d'abord une mesure sur une cote connue, puis « Calibrer… »",5000);
    return;
  }
  var m=l[l.length-1], mmF=Math.hypot(m.b.x-m.a.x,m.b.y-m.a.y)*plan._mmParPt;
  demander("Calibrer l'échelle",
    "Dernière mesure tracée : "+mmF.toFixed(1)+" mm sur la feuille.<br>"+
    "Saisissez sa longueur RÉELLE (en mètres) — par exemple la valeur d'une cote du plan.",
    "", function(v){
      var reel=parseFloat(String(v).replace(",","."));
      if(!(reel>0)){ indice("Valeur invalide",3000); return; }
      calib[plan.id]=(reel*1000)/mmF;
      forceEch=0; sauver(); majSelectEchelle(); dessiner();
      indice("Échelle calibrée : 1:"+Math.round(calib[plan.id])+" pour ce plan",4000);
    });
}
function demander(titre,html,val,ok){
  $("mTitre").textContent=titre; $("mTexte").innerHTML=html;
  $("mInput").value=val; $("modal").classList.add("show");
  setTimeout(function(){$("mInput").focus();$("mInput").select()},30);
  function fermer(){ $("modal").classList.remove("show"); $("mInput").onkeydown=null; }
  $("mNon").onclick=fermer;
  $("mOui").onclick=function(){ var v=$("mInput").value; fermer(); ok(v); };
  $("mInput").onkeydown=function(e){
    if(e.key==="Enter"){ e.preventDefault(); $("mOui").click(); }
    if(e.key==="Escape"){ e.preventDefault(); fermer(); }
  };
}

// ---------------------------------------------------------------- demarrage
function surTaille(){ if(besoinFit||autoCadre) ajuster(); else planifier(); }
addEventListener("resize",surTaille);
if(window.ResizeObserver) new ResizeObserver(surTaille).observe(stage);

function demarrer(){
  listerPlans();
  if(PLANS.length) ouvrir(PLANS[0]);
  else{
    $("splash").innerHTML="<b>Aucun plan publié</b><span>Relancez « Visionneuse web » depuis Revit.</span>";
    dessiner();
  }
}

// En file:// (double-clic), le navigateur interdit de demarrer un vrai Worker
// depuis un fichier local. On charge donc le moteur de rendu comme un simple
// script - ce que file:// autorise - et pdf.js s'en sert directement.
function lancer(){
  if(location.protocol==="file:" && !window.pdfjsWorker){
    var wsc=document.createElement("script");
    wsc.src="pdfjs/pdf.worker.min.js";
    wsc.onload=demarrer; wsc.onerror=demarrer;
    document.head.appendChild(wsc);
  }else{
    demarrer();
  }
}

if(typeof GARDE!=="undefined" && GARDE){
  // Le chiffrement du navigateur n'existe que sur une page servie en https
  // (ou en local). Ouverte par double-clic, la page ne peut pas dechiffrer :
  // autant le dire clairement plutot que d'echouer sans raison visible.
  if(!(window.crypto && crypto.subtle)){
    $("coffre").classList.add("on");
    $("cofErr").textContent = "Ces plans ne peuvent être ouverts que depuis "+
      "le lien https qui vous a été communiqué, pas par un double-clic sur le "+
      "fichier.";
    $("cofOk").disabled = true;
  }else{
    demanderMotDePasse();
  }
}else{
  poserDonnees(typeof DONNEES!=="undefined" ? DONNEES : null);
  lancer();
}

})();
